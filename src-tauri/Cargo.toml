[package]
name = "bigdata-knight-simulation"
version = "0.1.0"
description = "빅데이터분석기사 실기 연습 (Tauri)"
authors = ["you"]
edition = "2021"

[lib]
name = "bigdata_knight_simulation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# unsafe-headers: allow Authorization / Cookie etc. for OpenAI-compatible APIs
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# Avoid fat LTO + codegen-units=1 — peaks RAM and OOMs on CI / modest machines.
[profile.release]
panic = "abort"
codegen-units = 8
lto = "thin"
strip = true
opt-level = "s"
